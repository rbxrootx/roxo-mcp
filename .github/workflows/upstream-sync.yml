name: Upstream Sync

# Roxo is upstream Rojo with a small patch series applied on top. `main` is
# literally rojo-rbx/rojo's history plus a handful of Roxo commits, so
# `git log upstream/master..main` is the complete list of what this fork
# changes.
#
# Keeping that shape means taking upstream by *rebase*, not merge: the patches
# replay onto the new upstream and the fork never accumulates merge commits that
# obscure what it actually changed. This workflow does the replay, proves it
# still builds, and leaves the result for a human — a rebase rewrites history,
# which is not something to do to a shared branch unattended.

on:
  schedule:
    # Daily, early UTC, so a conflict is waiting at the start of the day rather
    # than landing in the middle of one.
    - cron: "0 6 * * *"

  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream ref to rebase onto"
        required: false
        default: "master"
      apply:
        description: "Force-push the rebased result to main if tests pass"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: https://github.com/rojo-rbx/rojo.git
  UPSTREAM_REF: ${{ github.event.inputs.upstream_ref || 'master' }}

jobs:
  sync:
    name: Rebase onto upstream Rojo
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          # The rebase needs real history on both sides, not a shallow clone.
          fetch-depth: 0
          submodules: true

      - name: Configure git identity
        run: |
          git config user.name "roxo-upstream-bot"
          git config user.email "actions@github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPO" || git remote set-url upstream "$UPSTREAM_REPO"
          git fetch upstream --tags

      - name: Work out the current patch series
        id: series
        run: |
          UPSTREAM_SHA="$(git rev-parse "upstream/$UPSTREAM_REF")"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "upstream_short=${UPSTREAM_SHA:0:7}" >> "$GITHUB_OUTPUT"

          # The commit our patches currently sit on. Because main is
          # upstream-plus-patches, the merge base is exactly that point.
          BASE="$(git merge-base HEAD "$UPSTREAM_SHA")"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

          COUNT="$(git rev-list --count "$BASE"..HEAD)"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

          echo "Roxo carries $COUNT patch(es) on top of $BASE:"
          git log --oneline "$BASE"..HEAD

          if [ "$BASE" = "$UPSTREAM_SHA" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Already rebased onto the latest upstream $UPSTREAM_REF."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "New upstream commits to take:"
            git log --oneline "$BASE".."$UPSTREAM_SHA" | head -50
          fi

      - name: Replay the patch series onto new upstream
        id: rebase
        if: steps.series.outputs.has_changes == 'true'
        run: |
          BRANCH="upstream-sync/${{ steps.series.outputs.upstream_short }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          git checkout -b "$BRANCH"

          if git rebase --onto "upstream/$UPSTREAM_REF" "${{ steps.series.outputs.base }}"; then
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
            echo "All ${{ steps.series.outputs.count }} patch(es) replayed cleanly."
          else
            echo "conflicts=true" >> "$GITHUB_OUTPUT"

            echo "Conflicting files:"
            git diff --name-only --diff-filter=U || true

            # Leave the rebase stopped rather than committing markers. A
            # conflicted rebase is resolved by continuing it, so a human needs
            # the rebase state intact, not a commit full of markers.
            git rebase --abort
            echo "Rebase aborted; resolve this one by hand."
          fi

      - name: Verify the rebased tree builds and tests
        id: verify
        if: steps.rebase.outputs.conflicts == 'false'
        continue-on-error: true
        run: |
          rustup toolchain install stable --profile minimal
          cargo test --locked

      - name: Push the rebased branch
        if: steps.rebase.outputs.conflicts == 'false'
        run: git push --force origin "${{ steps.rebase.outputs.branch }}"

      - name: Apply to main
        # Only on an explicit, manually dispatched request, and only when the
        # tests actually passed. A rebase rewrites main's history; that is a
        # decision a person makes, not a cron job.
        if: >
          steps.rebase.outputs.conflicts == 'false' &&
          steps.verify.outcome == 'success' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.apply == 'true'
        run: |
          git push --force-with-lease origin "HEAD:${{ github.ref_name }}"
          echo "main now sits on upstream ${{ steps.series.outputs.upstream_short }}."

      - name: Report
        if: steps.series.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Upstream sync"
            echo
            echo "Rebasing **${{ steps.series.outputs.count }}** Roxo patch(es) onto \`rojo-rbx/rojo@${{ steps.series.outputs.upstream_short }}\`."
            echo

            if [ "${{ steps.rebase.outputs.conflicts }}" = "true" ]; then
              echo "⚠️ **Conflicts.** Resolve by hand:"
              echo
              echo '```sh'
              echo "git fetch upstream"
              echo "git rebase --onto upstream/$UPSTREAM_REF ${{ steps.series.outputs.base }}"
              echo '```'
            elif [ "${{ steps.verify.outcome }}" = "success" ]; then
              echo "✅ Replayed cleanly and \`cargo test\` passed."
              echo
              echo "Branch \`${{ steps.rebase.outputs.branch }}\` is ready. To take it:"
              echo
              echo '```sh'
              echo "git fetch origin && git reset --hard origin/${{ steps.rebase.outputs.branch }}"
              echo "git push --force-with-lease origin main"
              echo '```'
              echo
              echo "Or re-run this workflow from the Actions tab with **apply** checked."
            else
              echo "⚠️ Replayed cleanly but \`cargo test\` failed — a Roxo patch likely needs updating for an upstream change."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
