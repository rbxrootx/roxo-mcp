name: CI

on:
  push:
    branches:
    - main

  pull_request:
    branches:
    - main

jobs:
  build:
    name: Build and Test
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest, windows-11-arm, ubuntu-22.04-arm]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Restore Rust Cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build
      run: cargo build --locked --verbose

    - name: Test
      run: cargo test --locked --verbose

    - name: Save Rust Cache
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

  msrv:
    name: Check MSRV
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install Rust
      uses: dtolnay/rust-toolchain@1.88.0

    - name: Restore Rust Cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build
      run: cargo build --locked --verbose

    - name: Save Rust Cache
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

  lint:
    name: Rustfmt, Clippy, Stylua, & Selene
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Restore Rust Cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Setup Rokit
      uses: CompeyDev/setup-rokit@v0.1.2
      with:
        version: 'v1.1.0'

    - name: Stylua
      run: stylua --check plugin/src

    - name: Selene
      run: selene plugin/src

    - name: Rustfmt
      run: cargo fmt -- --check

    - name: Clippy
      run: cargo clippy

    - name: Save Rust Cache
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

  conflict-markers:
    name: No conflict markers
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    # The upstream sync workflow commits conflicted merges on purpose, so that a
    # human has a branch to finish rather than a failed job with nothing in it.
    # This is what stops such a branch from being merged while still conflicted.
    - name: Check for unresolved conflict markers
      run: |
        if git grep -nE '^(<{7}|={7}|>{7})( |$)' -- . ':(exclude).github/workflows/ci.yml'; then
          echo "::error::Unresolved merge conflict markers are present."
          exit 1
        fi

  dev-build:
    name: Dev Build
    # Every push to main leaves a downloadable build attached to the run, so
    # trying a change never requires a local Rust toolchain or a tagged release.
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Setup Rokit
      uses: CompeyDev/setup-rokit@v0.1.2

    - name: Build
      run: cargo build --release --locked

    - name: Build Studio plugin
      run: cargo run --release --locked -- build plugin.project.json --output Roxo.rbxm

    - name: Upload binaries
      uses: actions/upload-artifact@v4
      with:
        name: roxo-linux-x86_64-${{ github.sha }}
        path: |
          target/release/roxo
          target/release/rojo
        if-no-files-found: error

    - name: Upload Studio plugin
      uses: actions/upload-artifact@v4
      with:
        name: Roxo.rbxm-${{ github.sha }}
        path: Roxo.rbxm
        if-no-files-found: error

